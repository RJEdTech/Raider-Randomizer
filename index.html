<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<title>Raider Randomizer</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#C11430">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f1a;color:#eee;min-height:100vh;padding:20px 16px}
body.fs{padding:8px}
.ctr{max-width:760px;margin:0 auto}
body.fs .ctr{max-width:100%}
body.fs .wh-area{width:min(70vh,90vw);max-width:min(70vh,90vw)}
body.fs .slot-area{width:min(50vh,80vw);max-width:min(50vh,80vw);height:min(45vh,300px)}
body.fs .slot-item{height:min(10vh,80px);font-size:min(4vh,32px)}
body.fs .slot-window{height:min(10vh,80px)}
body.fs .lotto-area{width:min(70vh,90vw);max-width:min(70vh,90vw);height:min(60vh,500px)}
body.fs .cards-area .crd{width:min(12vw,120px);height:min(8vw,70px);font-size:min(2vw,14px)}
body.fs .spot-name{padding:12px 18px;font-size:min(2.5vw,16px)}
body.fs .res-ban .nm{font-size:min(5vh,42px)}
body.fs .tabs .tab{padding:8px 16px;font-size:13px}
body.fs .t-display{font-size:min(20vh,120px)}
.hdr{text-align:center;margin-bottom:18px}
.hdr .sub{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:#666;margin-bottom:3px}
.hdr h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#C11430,#E8293D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .tag{font-size:11px;color:#666;margin-top:3px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px}
.sl{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
textarea{width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#eee;font-size:13px;font-family:inherit;resize:vertical;outline:none}
textarea::placeholder{color:#555}
.btn{padding:7px 18px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#C11430,#D4243B);color:#fff;font-weight:700;font-size:12px;font-family:inherit}
.btn:hover{opacity:.9}
.bo{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:0 0;color:#ccc;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600}
.bo:hover{background:rgba(255,255,255,.05)}
.bg{padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:0 0;color:#C11430;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600}
.r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;background:rgba(255,255,255,.04);color:#888;white-space:nowrap}
.tab.a{background:rgba(193,20,48,.15);color:#C11430;border-color:rgba(193,20,48,.3)}

/* Mode selector */
.modes{display:flex;gap:4px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
.mode-btn{padding:5px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;background:rgba(255,255,255,.03);color:#888}
.mode-btn.a{background:rgba(193,20,48,.12);color:#C11430;border-color:rgba(193,20,48,.25)}

.obar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:12px;font-size:12px}
.obar label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#aaa}
.obar input[type=checkbox]{accent-color:#C11430}

.res-ban{text-align:center;margin-bottom:12px;padding:12px 18px;border-radius:10px;background:linear-gradient(135deg,rgba(193,20,48,.12),rgba(193,20,48,.08));border:1px solid rgba(193,20,48,.2);display:none}
.res-ban.show{display:block}
.res-ban .lb{font-size:10px;color:#D4243B;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
.res-ban .nm{font-size:24px;font-weight:800;color:#fff}

/* Wheel */
.wh-area{position:relative;width:320px;max-width:85vw;margin:0 auto;aspect-ratio:1}
.ptr{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:10;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #C11430;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.ww{width:100%;height:100%;border-radius:50%;overflow:hidden;cursor:pointer;position:relative}
.ww.sp{cursor:default}
.whl{width:100%;height:100%;border-radius:50%;position:relative}
.cdot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#fff,#e0e0e0);box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:5;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#555;letter-spacing:.5px}
.shint{text-align:center;font-size:12px;color:#666;margin-top:8px}

/* Slot machine */
.slot-area{width:260px;max-width:85vw;margin:0 auto;height:200px;position:relative;overflow:hidden;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);cursor:pointer}
.slot-reel{position:absolute;left:0;right:0;transition:none}
.slot-item{height:60px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.slot-window{position:absolute;top:50%;left:0;right:0;height:60px;transform:translateY(-50%);background:rgba(193,20,48,.1);border-top:3px solid #C11430;border-bottom:3px solid #C11430;pointer-events:none;z-index:5}
.slot-window::before{content:'▶';position:absolute;left:6px;top:50%;transform:translateY(-50%);color:#C11430;font-size:14px}
.slot-window::after{content:'◀';position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#C11430;font-size:14px}
.slot-fade-top,.slot-fade-bot{position:absolute;left:0;right:0;height:70px;pointer-events:none;z-index:4}
.slot-fade-top{top:0;background:linear-gradient(to bottom,rgba(15,15,26,.95),transparent)}
.slot-fade-bot{bottom:0;background:linear-gradient(to top,rgba(15,15,26,.95),transparent)}

/* Cards */
.cards-area{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;perspective:800px;cursor:pointer;min-height:200px;align-items:center}
.crd{width:80px;height:50px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:all .3s;position:relative;transform-style:preserve-3d}
.crd.face-down{background:#333333;color:transparent}
.crd.face-down::after{content:'?';position:absolute;color:#888888;font-size:18px;font-weight:800}
.crd.selected{transform:scale(1.3);box-shadow:0 0 20px rgba(193,20,48,.5);z-index:10}
.crd.dimmed{opacity:.3;transform:scale(.9)}

/* Lottery */
.lotto-area{width:320px;max-width:85vw;height:280px;margin:0 auto;position:relative;border-radius:16px;border:2px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);overflow:hidden;cursor:pointer}
.lotto-ball{position:absolute;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transition:all .1s;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lotto-ball.winner{box-shadow:0 0 24px rgba(193,20,48,.6);z-index:20;transform:scale(1.4)}
.lotto-chute{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:40px;background:rgba(193,20,48,.15);border-top:2px solid #C11430;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#C11430;font-weight:700;z-index:15}

/* Spotlight */
.spot-area{display:grid;gap:6px;justify-content:center;cursor:pointer;min-height:200px;align-content:center}
.spot-name{padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.05);color:#888;font-size:13px;font-weight:600;text-align:center;transition:all .08s}
.spot-name.lit{background:rgba(193,20,48,.2);color:#C11430;transform:scale(1.08)}
.spot-name.won{background:rgba(193,20,48,.25);color:#fff;transform:scale(1.15);box-shadow:0 0 16px rgba(193,20,48,.3)}

/* Picked */
.pk-list{margin-top:12px}
.pk-list .title{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.pk-tags{display:flex;flex-wrap:wrap;gap:4px}
.pk-tag{padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;background:rgba(255,255,255,.03);color:#555;text-decoration:line-through}
.pk-tag.lat{background:rgba(193,20,48,.15);color:#C11430;text-decoration:none}

/* Groups/Teams grid */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gc{padding:12px;border-radius:10px}
.gc .gt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.gc .gm{font-size:13px;color:#ddd;padding:2px 0;font-weight:500}
.gs{text-align:center;margin-top:12px;font-size:11px;color:#666}

/* Lineup */
.lineup-list{counter-reset:lineup}
.lineup-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.03);counter-increment:lineup}
.lineup-item::before{content:counter(lineup);font-size:18px;font-weight:800;color:#C11430;min-width:28px;text-align:center}
.lineup-item .li-name{font-size:14px;font-weight:600;color:#eee}

/* Seating */
.seat-grid{display:grid;gap:8px;justify-content:center}
.seat{padding:8px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:12px;font-weight:600;color:#ddd;cursor:grab;user-select:none;transition:background .15s}
.seat:active{cursor:grabbing}
.seat.drag-over{background:rgba(193,20,48,.15);border-color:rgba(193,20,48,.3)}
.seat.empty-seat{color:#555;font-style:italic;border-style:dashed}

/* Timer */
.t-display{font-size:52px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:#eee;margin:10px 0;text-align:center}
.t-display.tw{color:#e05050}
.t-display.td{color:#C11430}
.t-pre{display:flex;gap:4px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.tp{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:0 0;color:#aaa;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600}
.tp.a{background:rgba(193,20,48,.15);color:#C11430;border-color:rgba(193,20,48,.3)}
.t-ctrls{display:flex;gap:6px;justify-content:center}

/* Saved */
.sv-sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.sv-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ccc;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600}
.sv-btn:hover{background:rgba(255,255,255,.08)}
.sv-btn .dx{margin-left:5px;color:#666}
.sv-btn .dx:hover{color:#C11430}

/* Toolbar */
.tbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.tb{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#888;cursor:pointer;font-size:11px;font-family:inherit;display:flex;align-items:center;gap:3px}
.tb:hover{background:rgba(255,255,255,.06);color:#ccc}
.tb.a{color:#C11430;border-color:rgba(193,20,48,.3)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:8px;background:#C11430;color:#fff;font-weight:700;font-size:12px;z-index:100;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.show{display:block}
.ftr{text-align:center;margin-top:24px;padding-top:12px;font-size:9px;color:#444;border-top:1px solid rgba(255,255,255,.04)}
.rj-mark{height:40px;width:auto;display:block;flex-shrink:0}
.header-text{display:flex;flex-direction:column;gap:.1rem}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;
 padding:1.1rem 0 .9rem;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:18px}
body.light .site-header{border-bottom-color:rgba(0,0,0,.10)}
.site-header .hl{display:flex;align-items:center;gap:.85rem;min-width:0;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:600;letter-spacing:.01em;color:#eee}
body.light .brand{color:#1a1a1a}
.brand .accent{color:#C11430}
.tagline{color:#888;font-size:.9rem}
body.light .tagline{color:#777}
.hdr-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.hdr-pill{padding:0 12px;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,.20);
 background:transparent;color:#aaa;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;
 display:inline-flex;align-items:center;gap:6px;transition:all .15s}
body.light .hdr-pill{border-color:rgba(0,0,0,.20);color:#666}
.hdr-pill:hover{border-color:#C11430;color:#C11430}
.hdr-pill.a{color:#C11430;border-color:rgba(193,20,48,.45)}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.20);color:#aaa;
 width:36px;height:36px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;
 justify-content:center;transition:all .15s;font-family:inherit;flex-shrink:0}
body.light .icon-btn{border-color:rgba(0,0,0,.20);color:#666}
.icon-btn:hover{border-color:#C11430;color:#C11430}
.icon-btn svg{width:18px;height:18px}
body:not(.light) .theme-toggle .icon-moon{display:none}
body:not(.light) .theme-toggle .icon-sun{display:block}
body.light .theme-toggle .icon-sun{display:none}
body.light .theme-toggle .icon-moon{display:block}
.site-footer{border-top:1px solid rgba(255,255,255,.08);margin-top:28px;padding:1.3rem 0;
 text-align:center;font-size:.85rem;color:#666}
body.light .site-footer{border-top-color:rgba(0,0,0,.10);color:#888}
.site-footer a{color:#999;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15);
 transition:color .15s,border-color .15s}
body.light .site-footer a{color:#666;border-bottom-color:rgba(0,0,0,.15)}
.site-footer a:hover{color:#C11430;border-color:#C11430}

body{position:relative}
.ctr{position:relative;z-index:1}
body.fs .watermark,body.fs .site-footer{display:none}
body.fs .site-header{border-bottom:none;margin-bottom:0;padding:8px 0;justify-content:flex-end}
.hid{display:none!important}
/* ====== LIGHT MODE ====== */
body.light{background:#ffffff;color:#1a1a1a}
body.light .hdr .sub{color:#999}
body.light .hdr h1{background:linear-gradient(135deg,#C11430,#8a0e22);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
body.light .hdr .tag{color:#999}
body.light .card{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.08)}
body.light .sl{color:#666}
body.light textarea{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.1);color:#1a1a1a}
body.light textarea::placeholder{color:#aaa}
body.light .bo{border-color:rgba(0,0,0,.15);color:#444}
body.light .bo:hover{background:rgba(0,0,0,.04)}
body.light .bg{border-color:rgba(0,0,0,.1);color:#C11430}
body.light .tab{background:rgba(0,0,0,.03);color:#888;border-color:transparent}
body.light .tab.a{background:rgba(193,20,48,.08);color:#C11430;border-color:rgba(193,20,48,.2)}
body.light .mode-btn{background:rgba(0,0,0,.03);color:#888;border-color:rgba(0,0,0,.06)}
body.light .mode-btn.a{background:rgba(193,20,48,.08);color:#C11430;border-color:rgba(193,20,48,.2)}
body.light .obar{background:rgba(0,0,0,.02)}
body.light .obar label{color:#666}
body.light .res-ban{background:linear-gradient(135deg,rgba(193,20,48,.06),rgba(193,20,48,.03));border-color:rgba(193,20,48,.15)}
body.light .res-ban .nm{color:#1a1a1a}
body.light .res-ban .lb{color:#C11430}
body.light .shint{color:#999}
body.light .tb{border-color:rgba(0,0,0,.08);background:rgba(0,0,0,.02);color:#888}
body.light .tb:hover{background:rgba(0,0,0,.05);color:#444}
body.light .tb.a{color:#C11430;border-color:rgba(193,20,48,.2)}
body.light .cdot{background:radial-gradient(circle,#fff,#ddd);color:#666}
body.light .pk-tag{background:rgba(0,0,0,.04);color:#999}
body.light .pk-tag.lat{background:rgba(193,20,48,.1);color:#C11430}
body.light .pk-list .title{color:#999}
body.light .slot-area{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.03)}
body.light .slot-fade-top{background:linear-gradient(to bottom,rgba(255,255,255,.95),transparent)}
body.light .slot-fade-bot{background:linear-gradient(to top,rgba(255,255,255,.95),transparent)}
body.light .spot-name{background:rgba(0,0,0,.04);color:#888}
body.light .spot-name.lit{background:rgba(193,20,48,.1);color:#C11430}
body.light .spot-name.won{background:rgba(193,20,48,.15);color:#1a1a1a;box-shadow:0 0 16px rgba(193,20,48,.15)}
body.light .crd.face-down{background:#ddd}
body.light .crd.face-down::after{color:#999}
body.light .lotto-area{border-color:rgba(0,0,0,.08);background:rgba(0,0,0,.02)}
body.light .lotto-chute{background:rgba(193,20,48,.08);border-color:#C11430;color:#C11430}
body.light .gc{border-color:rgba(0,0,0,.08)}
body.light .gc .gm{color:#333}
body.light .gs{color:#999}
body.light .lineup-item{background:rgba(0,0,0,.03)}
body.light .lineup-item .li-name{color:#1a1a1a}
body.light .seat{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08);color:#333}
body.light .seat.drag-over{background:rgba(193,20,48,.08);border-color:rgba(193,20,48,.2)}
body.light .seat.empty-seat{color:#bbb;border-color:rgba(0,0,0,.1)}
body.light .t-display{color:#1a1a1a}
body.light .t-display.tw{color:#e05050}
body.light .tp{border-color:rgba(0,0,0,.1);color:#888}

<script>
(function(){
var C=["#e74c3c","#3498db","#C11430","#f39c12","#9b59b6","#1abc9c","#e67e22","#2980b9","#a01028","#c0392b","#8e44ad","#16a085","#d35400","#2c3e50","#f1c40f","#7f8c8d","#e84393","#00b894","#6c5ce7","#fdcb6e"];
var allN=[],pool=[],picked=[],spinning=false,curRot=0,sndOn=true,animMode="wheel";
var grpSize=2,tmCount=2,seatCols=5,tSec=30,tRem=30,tInt=null,tRun=false;

// Audio
var actx=null;
function ac(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}return actx}
function tick(){if(!sndOn)return;var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=600+Math.random()*200;o.type="sine";g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.05);o.start(c.currentTime);o.stop(c.currentTime+.05)}
function chime(){if(!sndOn)return;var c=ac();if(!c)return;[523,659,784].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type="sine";var t=c.currentTime+i*.12;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)})}
function buzz(){if(!sndOn)return;var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=220;o.type="square";g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start(c.currentTime);o.stop(c.currentTime+.6)}

function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
function copyText(t){navigator.clipboard.writeText(t).then(function(){toast("Copied!")}).catch(function(){toast("Copy failed")})}

// Saved classes
function getSv(){try{return JSON.parse(localStorage.getItem("rs3_classes")||"{}")}catch(e){return{}}}
function setSv(d){try{localStorage.setItem("rs3_classes",JSON.stringify(d))}catch(e){}}
function renderSv(){
  var cl=getSv(),keys=Object.keys(cl),list=$("svList");
  list.innerHTML="";
  if(!keys.length){$("noSv").classList.remove("hid");return}
  $("noSv").classList.add("hid");
  keys.forEach(function(k){
    var b=document.createElement("button");b.className="sv-btn";
    b.innerHTML=k+' <span class="dx">\u2715</span>';
    b.addEventListener("click",function(e){
      if(e.target.classList.contains("dx")){if(confirm('Delete "'+k+'"?')){var c=getSv();delete c[k];setSv(c);renderSv()}return}
      $("inp").value=cl[k].join("\n");loadNames();
    });list.appendChild(b);
  });
}
$("saveBtn").addEventListener("click",function(){
  var names=parseInput();if(!names.length)return;
  var n=prompt('Name this class (e.g. "Period 1"):');if(!n||!n.trim())return;
  var c=getSv();c[n.trim()]=names;setSv(c);renderSv();
});
renderSv();

// Parse & Load
function parseInput(){return $("inp").value.split(/[\n,]+/).map(function(s){return s.trim()}).filter(function(s){return s.length>0})}
function loadNames(){
  allN=parseInput();if(!allN.length)return;
  pool=allN.slice();picked=[];curRot=0;
  $("cnt").textContent=allN.length+" name"+(allN.length!==1?"s":"")+" loaded";
  $("tool").classList.remove("hid");
  $("resBan").classList.remove("show");
  $("pkList").classList.add("hid");$("pkTags").innerHTML="";
  buildAnim();updateUI();
}
$("loadBtn").addEventListener("click",loadNames);

// Tabs
var panels=["spinner","single","lineup","groups","teams","seat","timer"];
function switchTab(t){
  panels.forEach(function(p){
    var el=$("p-"+p);if(el)el.classList.toggle("hid",p!==t);
  });
  document.querySelectorAll("#tabBar .tab").forEach(function(b){b.classList.toggle("a",b.getAttribute("data-t")===t)});
}
document.querySelectorAll("#tabBar .tab").forEach(function(b){
  b.addEventListener("click",function(){switchTab(b.getAttribute("data-t"))});
});

// Anim modes
document.querySelectorAll("#modeBar .mode-btn").forEach(function(b){
  b.addEventListener("click",function(){
    animMode=b.getAttribute("data-m");
    document.querySelectorAll("#modeBar .mode-btn").forEach(function(x){x.classList.toggle("a",x===b)});
    buildAnim();
  });
});

// Theme toggle
var stored=null;try{stored=localStorage.getItem("rr_theme")}catch(e){}
var isLight = stored ? (stored==="light") : true;            // light is the default
document.body.classList.toggle("light",isLight);
$("themeTgl").addEventListener("click",function(){
  isLight=!isLight;document.body.classList.toggle("light",isLight);
  try{localStorage.setItem("rr_theme",isLight?"light":"dark")}catch(e){}
});

// Sound & Fullscreen
$("sndTgl").addEventListener("click",function(){sndOn=!sndOn;$("sndTgl").textContent=sndOn?"🔊 Sound":"🔇 Muted";$("sndTgl").classList.toggle("a",!sndOn)});
var isFs=false;
$("fsTgl").addEventListener("click",function(){
  isFs=!isFs;document.body.classList.toggle("fs",isFs);
  $("hdr").classList.toggle("hid",isFs);$("inputCard").classList.toggle("hid",isFs);$("ftr").classList.toggle("hid",isFs);
  $("fsTgl").textContent=isFs?"⛶ Exit":"⛶ Fullscreen";$("fsTgl").classList.toggle("a",isFs);
  if(isFs&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});
  else if(!isFs&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
});

// Remove picked
$("rmCb").addEventListener("change",function(){doReset()});
$("rstBtn").addEventListener("click",function(){doReset()});
function doReset(){pool=allN.slice();picked=[];$("resBan").classList.remove("show");$("pkList").classList.add("hid");$("pkTags").innerHTML="";curRot=0;buildAnim();updateUI()}

function updateUI(){
  var rm=$("rmCb").checked;
  if(rm&&pool.length<allN.length){$("rstBtn").classList.remove("hid");$("rstBtn").textContent="Reset ("+pool.length+"/"+allN.length+" left)"}else $("rstBtn").classList.add("hid");
  if(pool.length>=2){$("animArea").classList.remove("hid");$("emptyMsg").classList.add("hid");$("hint").classList.remove("hid");$("hint").textContent="Tap to pick"}
  else if(pool.length===1){$("animArea").classList.add("hid");$("hint").classList.add("hid");$("emptyMsg").classList.remove("hid");$("emptyMsg").innerHTML='Only <strong style="color:#C11430">'+pool[0]+'</strong> remains!';addRstBtn($("emptyMsg"))}
  else{$("animArea").classList.add("hid");$("hint").classList.add("hid");$("emptyMsg").classList.remove("hid");$("emptyMsg").innerHTML="All names picked!";addRstBtn($("emptyMsg"))}
  renderPicked();
}
function addRstBtn(p){var b=document.createElement("button");b.className="bg";b.style.marginTop="10px";b.style.display="block";b.style.margin="10px auto 0";b.textContent="Reset Pool";b.addEventListener("click",doReset);p.appendChild(document.createElement("br"));p.appendChild(b)}
function renderPicked(){
  if(!$("rmCb").checked||!picked.length){$("pkList").classList.add("hid");return}
  $("pkList").classList.remove("hid");$("pkTags").innerHTML="";
  for(var i=picked.length-1;i>=0;i--){var s=document.createElement("span");s.className="pk-tag"+(i===picked.length-1?" lat":"");s.textContent=picked[i];$("pkTags").appendChild(s)}
}

function finishPick(name){
  $("resNm").textContent=name;$("resBan").classList.add("show");
  $("hint").textContent="Tap to pick again";
  chime();
  if($("rmCb").checked){picked.push(name);var idx=pool.indexOf(name);if(idx>-1)pool.splice(idx,1);setTimeout(function(){curRot=0;buildAnim();updateUI()},600)}
  spinning=false;
}

// ============ ANIMATIONS ============

function buildAnim(){
  var area=$("animArea");area.innerHTML="";
  if(pool.length<2)return;
  if(animMode==="wheel")buildWheel(area);
  else if(animMode==="slot")buildSlot(area);
  else if(animMode==="cards")buildCards(area);
  else if(animMode==="lotto")buildLotto(area);
  else if(animMode==="spot")buildSpot(area);
}

// WHEEL
function buildWheel(area){
  var w=document.createElement("div");w.className="wh-area";
  w.innerHTML='<div class="ptr"></div><div class="ww" id="ww"><div class="whl" id="whl"></div><div class="cdot">SPIN</div></div>';
  area.appendChild(w);
  var whl=$("whl"),n=pool.length,sa=360/n;
  var stops=[];for(var i=0;i<n;i++)stops.push(C[i%C.length]+" "+(i*sa).toFixed(2)+"deg "+((i+1)*sa).toFixed(2)+"deg");
  whl.style.background="conic-gradient(from 0deg,"+stops.join(",")+")";whl.style.borderRadius="50%";
  for(var i=0;i<n;i++){
    var mid=sa*i+sa/2,onL=(mid%360)>90&&(mid%360)<270,lr=onL?.32:.38;
    var rad=(mid-90)*Math.PI/180,x=50+lr*100*Math.cos(rad),y=50+lr*100*Math.sin(rad),tr=onL?mid+180:mid;
    var el=document.createElement("div");
    el.style.cssText="position:absolute;left:"+x+"%;top:"+y+"%;transform:translate(-50%,-50%) rotate("+tr+"deg);color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;z-index:2;font-size:"+(n>20?8:n>14?9:n>8?11:n>4?13:15)+"px";
    var d=pool[i];el.textContent=d.length>12?d.slice(0,10)+"\u2026":d;whl.appendChild(el);
  }
  $("ww").addEventListener("click",function(){
    if(spinning||pool.length<2)return;spinning=true;ac();
    var ti=Math.floor(Math.random()*n),tr=360-(ti+.5)*sa;
    var extra=(5+Math.floor(Math.random()*3))*360;
    var nr=curRot+extra+((tr-(curRot%360))+360)%360;
    whl.style.transition="none";whl.style.transform="rotate("+curRot+"deg)";void whl.offsetHeight;
    whl.style.transition="transform 4s cubic-bezier(.17,.67,.12,.99)";whl.style.transform="rotate("+nr+"deg)";curRot=nr;
    var tk=setInterval(tick,50),c=0;
    setTimeout(function(){clearInterval(tk);tk=setInterval(tick,150)},1500);
    setTimeout(function(){clearInterval(tk);tk=setInterval(tick,300)},2800);
    setTimeout(function(){clearInterval(tk)},3800);
    setTimeout(function(){clearInterval(tk);finishPick(pool[ti])},4200);
  });
}

// SLOT MACHINE
function buildSlot(area){
  var box=document.createElement("div");box.className="slot-area";box.id="slotBox";
  box.innerHTML='<div class="slot-fade-top"></div><div class="slot-fade-bot"></div><div class="slot-window"></div><div class="slot-reel" id="slotReel"></div>';
  area.appendChild(box);
  var reel=$("slotReel"),copies=10,items=[];
  for(var c=0;c<copies;c++)for(var i=0;i<pool.length;i++)items.push(pool[i]);
  items.forEach(function(nm,i){var d=document.createElement("div");d.className="slot-item";d.style.color=C[i%C.length];d.textContent=nm;reel.appendChild(d)});

  function getItemH(){var el=reel.querySelector(".slot-item");return el?el.offsetHeight:60}
  function getBoxH(){return box.offsetHeight}

  // Center first item in window
  var initTop=function(){var ih=getItemH(),bh=getBoxH();return(bh-ih)/2};
  reel.style.top=initTop()+"px";

  box.addEventListener("click",function(){
    if(spinning||pool.length<2)return;spinning=true;ac();
    var ti=Math.floor(Math.random()*pool.length);
    var ih=getItemH(),bh=getBoxH(),startY=(bh-ih)/2;
    var targetItem=(copies-2)*pool.length+ti;
    var targetY=-(targetItem*ih)+startY;
    reel.style.transition="none";reel.style.top=startY+"px";void reel.offsetHeight;
    reel.style.transition="top 4s cubic-bezier(.17,.67,.12,.99)";reel.style.top=targetY+"px";
    var tk=setInterval(tick,60);
    setTimeout(function(){clearInterval(tk);tk=setInterval(tick,200)},2000);
    setTimeout(function(){clearInterval(tk)},3800);
    setTimeout(function(){clearInterval(tk);finishPick(pool[ti])},4200);
  });
}

// CARDS
function buildCards(area){
  var box=document.createElement("div");box.className="cards-area";box.id="cardBox";area.appendChild(box);
  pool.forEach(function(nm,i){
    var d=document.createElement("div");d.className="crd";d.style.background=C[i%C.length];d.textContent=nm;d.setAttribute("data-i",i);
    box.appendChild(d);
  });
  box.addEventListener("click",function(){
    if(spinning||pool.length<2)return;spinning=true;ac();
    var cards=box.querySelectorAll(".crd"),ti=Math.floor(Math.random()*pool.length);
    // Flip all face down
    cards.forEach(function(c){c.classList.add("face-down");c.classList.remove("selected","dimmed")});
    // Shuffle animation
    var shuffles=0,si=setInterval(function(){
      cards.forEach(function(c){c.style.transform="translate("+(Math.random()*20-10)+"px,"+(Math.random()*10-5)+"px) rotate("+(Math.random()*10-5)+"deg)"});
      tick();shuffles++;
      if(shuffles>20){clearInterval(si);
        cards.forEach(function(c){c.style.transform=""});
        // Reveal sequence
        var revIdx=0,ri=setInterval(function(){
          if(revIdx>=cards.length){clearInterval(ri);
            setTimeout(function(){
              cards.forEach(function(c,j){
                if(parseInt(c.getAttribute("data-i"))===ti){c.classList.remove("face-down");c.classList.add("selected")}
                else c.classList.add("dimmed");
              });
              finishPick(pool[ti]);
            },300);return;
          }
          tick();revIdx++;
        },80);
      }
    },100);
  });
}

// LOTTERY
function buildLotto(area){
  var box=document.createElement("div");box.className="lotto-area";box.id="lottoBox";
  box.innerHTML='<div class="lotto-chute" id="chute">▼</div>';
  area.appendChild(box);
  var balls=[],w=320,h=280;
  pool.forEach(function(nm,i){
    var b=document.createElement("div");b.className="lotto-ball";b.style.background=C[i%C.length];
    b.textContent=nm.length>6?nm.slice(0,5)+"\u2026":nm;
    b.style.left=Math.random()*(w-48)+"px";b.style.top=Math.random()*(h-90)+"px";
    box.appendChild(b);
    balls.push({el:b,x:Math.random()*(w-48),y:Math.random()*(h-90),vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4});
  });
  // Idle bounce
  var bounceId=setInterval(function(){
    balls.forEach(function(b){
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<0||b.x>w-48){b.vx*=-1;b.x=Math.max(0,Math.min(w-48,b.x))}
      if(b.y<0||b.y>h-90){b.vy*=-1;b.y=Math.max(0,Math.min(h-90,b.y))}
      b.el.style.left=b.x+"px";b.el.style.top=b.y+"px";
    });
  },30);

  box.addEventListener("click",function(){
    if(spinning||pool.length<2)return;spinning=true;ac();
    var ti=Math.floor(Math.random()*pool.length);
    // Speed up
    balls.forEach(function(b){b.vx*=3;b.vy*=3});
    var tkI=setInterval(tick,100);
    // Slow down after 2s
    setTimeout(function(){balls.forEach(function(b){b.vx*=.3;b.vy*=.3})},2000);
    setTimeout(function(){
      clearInterval(tkI);clearInterval(bounceId);
      // Winner moves to chute
      balls.forEach(function(b,i){
        b.vx=0;b.vy=0;
        if(i===ti){b.el.classList.add("winner");b.el.style.left=(w/2-24)+"px";b.el.style.top=(h-65)+"px";b.el.style.transition="all .5s"}
        else{b.el.style.opacity=".3";b.el.style.transition="opacity .5s"}
      });
      setTimeout(function(){finishPick(pool[ti])},600);
    },3000);
  });
}

// SPOTLIGHT
function buildSpot(area){
  var box=document.createElement("div");box.className="spot-area";box.id="spotBox";
  var cols=Math.min(pool.length,Math.ceil(Math.sqrt(pool.length)));
  box.style.gridTemplateColumns="repeat("+cols+",1fr)";
  area.appendChild(box);
  pool.forEach(function(nm){var d=document.createElement("div");d.className="spot-name";d.textContent=nm;box.appendChild(d)});

  box.addEventListener("click",function(){
    if(spinning||pool.length<2)return;spinning=true;ac();
    var items=box.querySelectorAll(".spot-name"),ti=Math.floor(Math.random()*pool.length);
    var count=0,total=25+Math.floor(Math.random()*15),cur=-1;
    var si=setInterval(function(){
      if(cur>=0)items[cur].classList.remove("lit");
      // Slow down near end
      if(count>total-5){
        clearInterval(si);
        var slowCount=count;
        var delays=[120,180,250,350,500];
        function slowStep(){
          if(cur>=0)items[cur].classList.remove("lit");
          var idx=slowCount<total?Math.floor(Math.random()*pool.length):ti;
          items[idx].classList.add("lit");cur=idx;tick();slowCount++;
          if(slowCount<=total)setTimeout(slowStep,delays[slowCount-total+4]||500);
          else{items[ti].classList.remove("lit");items[ti].classList.add("won");finishPick(pool[ti])}
        }
        slowStep();return;
      }
      var next=Math.floor(Math.random()*pool.length);
      items[next].classList.add("lit");cur=next;tick();count++;
    },60);
  });
}

// ============ SINGLE NAME ============
$("singleBtn").addEventListener("click",function(){
  if(!allN.length)return;
  var nm=allN[Math.floor(Math.random()*allN.length)];
  $("singleNm").textContent=nm;$("singleBan").style.display="block";chime();
});

// ============ LINEUP ============
$("lineupBtn").addEventListener("click",function(){
  if(!allN.length)return;var s=shuffle(allN),list=$("lineupList");list.innerHTML="";
  s.forEach(function(nm){var d=document.createElement("div");d.className="lineup-item";
    var sp=document.createElement("span");sp.className="li-name";sp.textContent=nm;d.appendChild(sp);list.appendChild(d)});
  $("cpLineup").classList.remove("hid");
  $("cpLineup").onclick=function(){copyText(s.map(function(n,i){return(i+1)+". "+n}).join("\n"))};
});

// ============ GROUPS ============
function buildNumBtns(container,min,max,active,setter){
  container.innerHTML="";
  for(var n=min;n<=max;n++){(function(n){
    var b=document.createElement("button");b.className="mode-btn"+(n===active?" a":"");b.textContent=n;b.style.minWidth="32px";
    b.addEventListener("click",function(){setter(n);container.querySelectorAll(".mode-btn").forEach(function(x){x.classList.toggle("a",x===b)})});
    container.appendChild(b);
  })(n)}
}
function doGroups(){buildNumBtns($("grpBtns"),2,6,grpSize,function(v){grpSize=v})}
function doTeams(){buildNumBtns($("tmBtns"),2,6,tmCount,function(v){tmCount=v})}
doGroups();doTeams();

function renderGroupGrid(groups,gridEl,sumEl,cpEl,label){
  gridEl.innerHTML="";
  groups.forEach(function(g,i){
    var card=document.createElement("div");card.className="gc";
    card.style.background=C[i%C.length]+"11";card.style.border="1px solid "+C[i%C.length]+"33";
    var t=document.createElement("div");t.className="gt";t.style.color=C[i%C.length];t.textContent=label+" "+(i+1);card.appendChild(t);
    g.forEach(function(nm){var d=document.createElement("div");d.className="gm";d.textContent=nm;card.appendChild(d)});
    gridEl.appendChild(card);
  });
  sumEl.classList.remove("hid");sumEl.textContent=allN.length+" students in "+groups.length+" "+label.toLowerCase()+(groups.length!==1?"s":"");
  cpEl.classList.remove("hid");
  cpEl.onclick=function(){copyText(groups.map(function(g,i){return label+" "+(i+1)+": "+g.join(", ")}).join("\n"))};
}

$("genGrp").addEventListener("click",function(){
  if(!allN.length)return;var s=shuffle(allN),groups=[];
  for(var i=0;i<s.length;i+=grpSize)groups.push(s.slice(i,i+grpSize));
  renderGroupGrid(groups,$("grpGrid"),$("grpSum"),$("cpGrp"),"Group");
});

$("genTm").addEventListener("click",function(){
  if(!allN.length)return;var s=shuffle(allN),teams=[];
  for(var i=0;i<tmCount;i++)teams.push([]);
  s.forEach(function(nm,i){teams[i%tmCount].push(nm)});
  renderGroupGrid(teams,$("tmGrid"),$("tmSum"),$("cpTm"),"Team");
});

// ============ SEATING ============
var seatCols=5;
buildNumBtns($("colBtns"),3,8,seatCols,function(v){seatCols=v});

$("genSeat").addEventListener("click",function(){
  if(!allN.length)return;
  var s=shuffle(allN),grid=$("seatGrid");grid.innerHTML="";
  grid.style.gridTemplateColumns="repeat("+seatCols+",1fr)";
  // Pad to fill grid
  var total=Math.ceil(s.length/seatCols)*seatCols;
  for(var i=0;i<total;i++){
    var d=document.createElement("div");
    d.className="seat"+(i>=s.length?" empty-seat":"");
    d.textContent=i<s.length?s[i]:"empty";
    d.setAttribute("draggable","true");
    d.setAttribute("data-idx",i);
    // Drag events
    d.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",this.getAttribute("data-idx"));this.style.opacity=".4"});
    d.addEventListener("dragend",function(){this.style.opacity="1"});
    d.addEventListener("dragover",function(e){e.preventDefault();this.classList.add("drag-over")});
    d.addEventListener("dragleave",function(){this.classList.remove("drag-over")});
    d.addEventListener("drop",function(e){
      e.preventDefault();this.classList.remove("drag-over");
      var fromIdx=e.dataTransfer.getData("text/plain");
      var fromEl=grid.querySelector('[data-idx="'+fromIdx+'"]');
      if(fromEl&&fromEl!==this){
        var tmp=this.textContent;var tmpClass=this.classList.contains("empty-seat");
        this.textContent=fromEl.textContent;this.classList.toggle("empty-seat",fromEl.classList.contains("empty-seat"));
        fromEl.textContent=tmp;fromEl.classList.toggle("empty-seat",tmpClass);
      }
    });
    grid.appendChild(d);
  }
});

$("cpSeat").addEventListener("click",function(){
  var seats=$("seatGrid").querySelectorAll(".seat");if(!seats.length)return;
  var rows=[],row=[];
  seats.forEach(function(s,i){
    row.push(s.classList.contains("empty-seat")?"[empty]":s.textContent);
    if((i+1)%seatCols===0){rows.push(row.join("\t"));row=[]}
  });
  if(row.length)rows.push(row.join("\t"));
  copyText("Seating Chart\n"+rows.join("\n"));
});

// ============ TIMER ============
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec}
function updTimerDisp(){$("tDisp").textContent=fmtTime(tRem);$("tDisp").classList.remove("tw","td");if(tRem<=5&&tRem>0)$("tDisp").classList.add("td");else if(tRem<=15)$("tDisp").classList.add("tw")}
function setTimer(s){tSec=s;tRem=s;clearInterval(tInt);tRun=false;$("tStart").textContent="Start";updTimerDisp()}

[30,60,90,120,180,300].forEach(function(s){
  var b=document.createElement("button");b.className="tp"+(s===30?" a":"");b.textContent=fmtTime(s);b.setAttribute("data-s",s);
  b.addEventListener("click",function(){setTimer(s);$("tPre").querySelectorAll(".tp").forEach(function(x){x.classList.toggle("a",x===b)})});
  $("tPre").appendChild(b);
});
$("tCustBtn").addEventListener("click",function(){var v=parseInt($("tCust").value);if(v&&v>=5&&v<=600){setTimer(v);$("tPre").querySelectorAll(".tp").forEach(function(x){x.classList.remove("a")})}});
$("tStart").addEventListener("click",function(){
  if(tRun){clearInterval(tInt);tRun=false;$("tStart").textContent="Resume";return}
  if(tRem<=0){tRem=tSec;updTimerDisp()}
  tRun=true;$("tStart").textContent="Pause";
  tInt=setInterval(function(){
    tRem--;updTimerDisp();
    if(tRem<=5&&tRem>0)tick();
    if(tRem<=0){clearInterval(tInt);tRun=false;$("tStart").textContent="Start";buzz();$("tDisp").classList.add("td");$("tDisp").textContent="0:00"}
  },1000);
});
$("tReset").addEventListener("click",function(){setTimer(tSec)});
updTimerDisp();

})();
